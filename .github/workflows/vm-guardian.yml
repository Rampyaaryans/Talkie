name: blast-arm VM Guardian 🛡️

# ── Triggers ────────────────────────────────────────────────
on:
  schedule:
    # Every 30 minutes, 24/7 — completely automatic, no human needed
    - cron: '*/30 * * * *'
  push:
    branches: [master, main]   # Also runs on every code push
  workflow_dispatch:            # Manual trigger from GitHub UI

# Prevent parallel runs from conflicting
concurrency:
  group: vm-guardian
  cancel-in-progress: false

jobs:
  guardian:
    name: 🛡️ Check & Heal blast-arm
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      INSTANCE_ID: "ocid1.instance.oc1.phx.anyhqljr4x4qntycxa6y7uqcsjuafte7j5s7phdphkd4thjyhak6ggod3juq"
      VM_IP: "129.146.108.100"
      TENANCY_ID: "ocid1.tenancy.oc1..aaaaaaaa5frx4pqrno45woojq5rlrl7tyr4rkxy7csdrnbvvatqfaq7kyzha"

    steps:
      # ── Step 1: Setup OCI CLI (fast — uses pip cache) ──────
      - name: ⚙️ Setup OCI CLI
        run: |
          pip install oci-cli --quiet --no-warn-script-location
          oci --version

      # ── Step 2: Configure OCI credentials ──────────────────
      - name: 🔑 Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          # Write config from GitHub Secret
          cat > ~/.oci/config << 'CONFIG_EOF'
          ${{ secrets.OCI_CONFIG }}
          CONFIG_EOF
          # Write signing key from GitHub Secret
          echo "${{ secrets.OCI_SIGNING_KEY }}" > ~/.oci/oci_signing_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_signing_key.pem
          # Verify credentials work
          oci iam user list --compartment-id "$TENANCY_ID" --limit 1 --query 'data[0].name' --raw-output 2>/dev/null && echo "✅ OCI auth OK" || echo "⚠️ OCI auth check failed"

      # ── Step 3: Check VM state ──────────────────────────────
      - name: 🔍 Check VM lifecycle state
        id: vm_state
        run: |
          STATE=$(oci compute instance get \
            --instance-id "$INSTANCE_ID" \
            --query 'data."lifecycle-state"' \
            --raw-output 2>/dev/null || echo "UNKNOWN")
          echo "state=$STATE" >> $GITHUB_OUTPUT
          echo "VM State: $STATE"

      # ── Step 4a: Auto-start if STOPPED ─────────────────────
      - name: 🔴 Auto-start VM if STOPPED
        if: steps.vm_state.outputs.state == 'STOPPED'
        run: |
          echo "🚨 VM is STOPPED — starting now!"
          oci compute instance action \
            --instance-id "$INSTANCE_ID" \
            --action START
          echo "⏳ Waiting up to 3 min for RUNNING state..."
          for i in $(seq 1 18); do
            sleep 10
            STATE=$(oci compute instance get \
              --instance-id "$INSTANCE_ID" \
              --query 'data."lifecycle-state"' \
              --raw-output 2>/dev/null)
            echo "  [$((i*10))s] State: $STATE"
            if [ "$STATE" = "RUNNING" ]; then
              echo "✅ VM is RUNNING again!"
              break
            fi
          done

      # ── Step 4b: Report healthy state ──────────────────────
      - name: ✅ Report VM healthy
        if: steps.vm_state.outputs.state == 'RUNNING'
        run: |
          echo "✅ VM is RUNNING at $VM_IP"
          # Check HTTP health endpoint (our bot's health server)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 8 --max-time 12 \
            "http://$VM_IP:4000/" 2>/dev/null || echo "000")
          echo "OpenClaw Gateway HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "✅ OpenClaw gateway is responding"
          else
            echo "⚠️  Gateway HTTP $HTTP — may be starting up or bot is down"
          fi

      # ── Step 5: Log summary ─────────────────────────────────
      - name: 📊 Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  blast-arm Guardian Run Complete"
          echo "  Time (IST): $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S')"
          echo "  VM State:   ${{ steps.vm_state.outputs.state }}"
          echo "  VM IP:      $VM_IP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
