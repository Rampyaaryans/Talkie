name: blast-arm VM Guardian 🛡️

# ── Triggers ────────────────────────────────────────────────
on:
  schedule:
    # Every 30 minutes, 24/7 — completely automatic, zero human intervention
    - cron: '*/30 * * * *'
  push:
    branches: [master, main]   # Fires immediately on every code push
  workflow_dispatch:            # Manual trigger from GitHub UI anytime

# Prevent parallel runs conflicting
concurrency:
  group: vm-guardian
  cancel-in-progress: false

jobs:
  guardian:
    name: 🛡️ Check & Heal blast-arm
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      INSTANCE_ID: "ocid1.instance.oc1.phx.anyhqljr4x4qntycxa6y7uqcsjuafte7j5s7phdphkd4thjyhak6ggod3juq"
      VM_IP: "129.146.108.100"
      TENANCY_ID: "ocid1.tenancy.oc1..aaaaaaaa5frx4pqrno45woojq5rlrl7tyr4rkxy7csdrnbvvatqfaq7kyzha"

    steps:
      # ── Step 1: Setup OCI CLI ──────────────────────────────
      - name: ⚙️ Setup OCI CLI
        run: |
          pip install oci-cli --quiet --no-warn-script-location
          echo "OCI CLI version: $(oci --version)"

      # ── Step 2: Write OCI credentials from secrets ─────────
      - name: 🔑 Configure OCI credentials
        env:
          OCI_CONFIG_CONTENT: ${{ secrets.OCI_CONFIG }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_SIGNING_KEY }}
        run: |
          mkdir -p ~/.oci
          # Write config file — use $HOME not ~ (OCI CLI doesn't expand ~)
          printf '%s\n' "$OCI_CONFIG_CONTENT" > ~/.oci/config
          # Replace key_file=~/ with key_file=$HOME/ for OCI CLI compatibility
          sed -i "s|key_file=~/|key_file=$HOME/|g" ~/.oci/config
          # Write private signing key
          printf '%s\n' "$OCI_KEY_CONTENT" > ~/.oci/oci_signing_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_signing_key.pem
          # Verify (grep redacts secrets automatically)
          echo "key_file line: $(grep key_file ~/.oci/config)"
          echo "Key file size: $(wc -c < ~/.oci/oci_signing_key.pem) bytes"

      # ── Step 3: Check VM state ──────────────────────────────
      - name: 🔍 Check VM lifecycle state
        id: vm_state
        run: |
          echo "Querying OCI for blast-arm state..."
          STATE=$(oci compute instance get \
            --instance-id "$INSTANCE_ID" \
            --query 'data."lifecycle-state"' \
            --raw-output 2>&1) || STATE="ERROR"
          echo "Raw OCI response: $STATE"
          # Clean up state value
          STATE=$(echo "$STATE" | grep -E "^[A-Z]" | head -1 || echo "UNKNOWN")
          echo "state=$STATE" >> $GITHUB_OUTPUT
          echo "VM State: $STATE"

      # ── Step 4a: Auto-start if STOPPED ─────────────────────
      - name: 🔴 Auto-start VM if STOPPED
        if: steps.vm_state.outputs.state == 'STOPPED'
        run: |
          echo "🚨 VM is STOPPED — starting now!"
          oci compute instance action \
            --instance-id "$INSTANCE_ID" \
            --action START
          echo "⏳ Waiting up to 3 min for RUNNING state..."
          for i in $(seq 1 18); do
            sleep 10
            STATE=$(oci compute instance get \
              --instance-id "$INSTANCE_ID" \
              --query 'data."lifecycle-state"' \
              --raw-output 2>/dev/null | tr -d '"' || echo "UNKNOWN")
            echo "  [$((i*10))s] State: $STATE"
            if [ "$STATE" = "RUNNING" ]; then
              echo "✅ VM is RUNNING again!"
              break
            fi
          done

      # ── Step 4b: VM is healthy ─────────────────────────────
      - name: ✅ Report VM healthy
        if: steps.vm_state.outputs.state == 'RUNNING'
        run: |
          echo "✅ VM is RUNNING at $VM_IP"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 8 --max-time 12 \
            "http://$VM_IP:4000/" 2>/dev/null || echo "000")
          echo "OpenClaw Gateway HTTP status: $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ OpenClaw gateway OK" || echo "⚠️ Gateway HTTP $HTTP"

      # ── Step 5: Summary ─────────────────────────────────────
      - name: 📊 Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  blast-arm Guardian Run Complete"
          echo "  Time (IST): $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S')"
          echo "  VM State:   ${{ steps.vm_state.outputs.state }}"
          echo "  VM IP:      $VM_IP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
